<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
  <title id="t">LifePage architecture and privacy</title>
  <desc id="d">Your browser holds all data in local storage and calls Groq and Google Gemini directly with your own keys. There is no LifePage server.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c8fb0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1000" height="420" rx="20" fill="#f0f4f8"/>
  <text x="36" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#2563eb">DATA &amp; PRIVACY</text>

  <rect x="36" y="76" width="470" height="300" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="62" y="112" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#0f1e35">Your browser</text>
  <text x="62" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#4a6080">LifePage PWA · installed or in a tab</text>
  <rect x="62" y="160" width="418" height="62" rx="10" fill="#e4ecf4"/>
  <text x="78" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f1e35">localStorage</text>
  <text x="78" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#4a6080">chapters · drafts · photos · palette · model choice</text>
  <rect x="62" y="234" width="418" height="62" rx="10" fill="#e4ecf4"/>
  <text x="78" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f1e35">Your API keys</text>
  <text x="78" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#4a6080">stored on-device · never written into backups</text>
  <rect x="62" y="308" width="418" height="48" rx="10" fill="#e4ecf4"/>
  <text x="78" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#4a6080">Service worker: app shell works offline</text>

  <path d="M506 170 H610" stroke="#7c8fb0" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M506 300 H610" stroke="#7c8fb0" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="558" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#4a6080">direct</text>
  <text x="558" y="290" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#4a6080">direct</text>

  <rect x="614" y="116" width="350" height="110" rx="14" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.5"/>
  <text x="636" y="148" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#0f1e35">Groq</text>
  <text x="636" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#4a6080">AI Interview · cross-chapter notes</text>
  <text x="636" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#4a6080">voice transcription (Whisper)</text>
  <text x="636" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7c3aed">only when you use those features</text>

  <rect x="614" y="246" width="350" height="110" rx="14" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.5"/>
  <text x="636" y="278" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#0f1e35">Google Gemini</text>
  <text x="636" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#4a6080">chapter drafts · full memoir compile</text>
  <text x="636" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#4a6080">Vault chapters skipped in Abbreviated view</text>
  <text x="636" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7c3aed">only when you tap Write / Compile</text>

  <text x="500" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f1e35">No LifePage server. No account. No analytics.</text>
</svg>
